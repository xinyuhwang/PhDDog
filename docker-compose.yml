services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: phddog
      POSTGRES_PASSWORD: phddog
      POSTGRES_DB: phddog
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phddog"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://phddog:phddog@db:5432/phddog
      DATA_DIR: /data
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://phddog:phddog@db:5432/phddog
      DATA_DIR: /data
    command: python -m app.worker
    volumes:
      - ./backend:/app
      - ./data:/data
    depends_on:
      api:
        condition: service_started

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
  frontend_node_modules:
